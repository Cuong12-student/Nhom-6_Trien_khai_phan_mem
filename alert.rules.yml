groups:
  - name: bhgbd_monitoring_rules
    rules:
      - alert: HighContainerCPU
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name="bhgbd_net9_app"}[1m])) * 100 > 80
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Quá tải CPU trên container {{ $labels.name }}"
          description: "Container {{ $labels.name }} đang tiêu thụ trên 80% CPU trong hơn 30 giây."

      - alert: WebApplicationDown
        expr: absent(container_memory_usage_bytes{name=~".*bhgbd_net9_app.*"})
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Dịch vụ web bhgbd_net9_app ngừng hoạt động"
          description: "Không ghi nhận dữ liệu tài nguyên từ container bhgbd_net9_app."