global:
  scrape_interval: 5s     # Tần suất thu thập dữ liệu (5 giây/lần)
  evaluation_interval: 5s

scrape_configs:
  # Thu thập chính thông số của Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Thu thập thông số phần cứng container từ cAdvisor
  - job_name: 'docker-cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']