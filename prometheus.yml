global:
  scrape_interval: 15s     # Tần suất thu thập dữ liệu (15 giây/lần)
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager_monitoring:9093']
scrape_configs:
  # Thu thập chính thông số của Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Thu thập thông số phần cứng container từ cAdvisor
  - job_name: 'docker-cadvisor'
    static_configs:
      - targets: ['cadvisor_monitoring:8080']